[project]
name = "manak_sahayak"
version = "0.1.0"
description = "Manak Sahayak Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.103.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic-settings>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.5.0",
    "httpx>=0.24.0"
]

[tool.mypy]
strict = true

[tool.setuptools]
packages = ["app"]
