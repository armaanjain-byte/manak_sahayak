[project]
name = "manak_sahayak"
version = "0.1.0"
description = "Manak Sahayak Backend"
requires-python = ">=3.10"
# NOTE: requirements.txt is the source of truth for dependencies.
# Please update requirements.txt when adding a new dependency, and sync here.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.2,<3.3",
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.28",
    "mypy>=1.13,<1.14",
    "ruff>=0.7,<0.8",
    "requests>=2.32,<2.33",
    "anthropic>=0.30.0"
]

[tool.mypy]
strict = true

[tool.setuptools]
packages = ["app", "backend"]
